<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Proto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1e1e1e;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 8px 12px;
      background: #2d2d2d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    label {
      font-size: 13px;
    }

    input[type="color"],
    input[type="range"],
    button {
      cursor: pointer;
    }

    button {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #3a3a3a;
      color: #f0f0f0;
    }

    button:hover {
      background: #4a4a4a;
    }

    #board-id {
      opacity: 0.7;
      font-size: 12px;
    }

    canvas {
      flex: 1;
      display: block;
      background: #ffffff;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <header>
    <div class="controls">
      <label>
        Color:
        <input type="color" id="color-picker" value="#000000">
      </label>
      <label>
        Width:
        <input type="range" id="width-picker" min="1" max="20" value="3">
      </label>
      <button id="clear-btn">Clear Board</button>
    </div>
    <div id="board-id">Board: default-board</div>
  </header>

  <canvas id="board"></canvas>

  <!-- Socket.IO from CDN -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
